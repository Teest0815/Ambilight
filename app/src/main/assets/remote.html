<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambilight Fernbedienung</title>
<style>
:root{--bg:#F8F9FA;--card:#fff;--line:#DADCE0;--text:#202124;--sub:#5F6368;--pri:#1A73E8;--onpri:#fff;--chip:#E8F0FE;--err:#D93025;--ok:#188038}
@media (prefers-color-scheme:dark){:root{--bg:#202124;--card:#303134;--line:#5F6368;--text:#E8EAED;--sub:#9AA0A6;--pri:#8AB4F8;--onpri:#202124;--chip:#3C4043;--err:#F28B82;--ok:#81C995}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:16px 16px 8px;z-index:2;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px}
#status{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:14px;margin-top:4px}
#dot{width:10px;height:10px;border-radius:50%;background:#80868B;flex:none}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tab{border:1px solid var(--line);background:none;color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--chip);border-color:var(--pri);color:var(--pri);font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.t{font-weight:600}.s{color:var(--sub);font-size:13px;margin-top:2px}
input[type=text],select{width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input[type=range]{width:100%;margin-top:10px;accent-color:var(--pri)}
.val{color:var(--pri);font-weight:600}
.sw{position:relative;width:52px;height:30px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s}
.sw span:after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--pri)}.sw input:checked+span:after{left:26px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
#fatal{padding:32px 16px;text-align:center;color:var(--err)}
</style>
</head>
<body>
<header>
  <h1>Ambilight</h1>
  <div id="status"><span id="dot"></span><span id="stext">Verbinde …</span></div>
  <div id="tabs"></div>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
const KEY=new URLSearchParams(location.search).get('k')||'';
let state=null,page=0,busy=false;
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Key':KEY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'Unerwartete Antwort'}));
  if(!r.ok)throw new Error(j.error||('Fehler '+r.status));
  return j;
}
function status(){
  if(!state)return;
  const s=state.status||'';
  document.getElementById('stext').textContent=s+' · Version '+state.version;
  document.getElementById('dot').style.background=/^Läuft, aber|^Warte/.test(s)?'#FFB020':/^Läuft/.test(s)?'#3DDC84':/^Pausiert/.test(s)?'#4DA3FF':'#80868B';
}
function tabs(){
  const t=document.getElementById('tabs');t.textContent='';
  state.pages.forEach((p,i)=>{const b=$('button','tab'+(i===page?' on':''),p.title);b.onclick=()=>{page=i;tabs();render()};t.appendChild(b)});
}
async function save(key,value,item){
  try{const before=state.hidden.join();state=await api('/api/set',{key,value});status();if(state.hidden.join()!==before)render(true)}
  catch(e){toast(e.message);try{state=await api('/api/state')}catch(_){}render(true)}
}
function debounce(fn,ms){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms)}}
function render(keepFocus){
  const main=document.getElementById('main');
  const focus=keepFocus&&document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  main.textContent='';
  const hidden=new Set(state.hidden);
  for(const it of state.pages[page].items){
    if(hidden.has(it.key))continue;
    const c=$('div','card');
    const head=$('div');head.appendChild($('div','t',it.title));
    if(it.summary)head.appendChild($('div','s',it.summary));
    if(it.type==='switch'){
      const row=$('div','row');row.appendChild(head);
      const l=$('label','sw');const i=$('input');i.type='checkbox';i.checked=it.value;i.dataset.key=it.key;
      i.onchange=()=>save(it.key,i.checked,it);l.appendChild(i);l.appendChild($('span'));row.appendChild(l);c.appendChild(row);
    }else if(it.type==='seek'){
      const row=$('div','row');row.appendChild(head);const v=$('div','val',it.value);row.appendChild(v);c.appendChild(row);
      const i=$('input');i.type='range';i.min=it.min;i.max=it.max;i.step=it.step;i.value=it.value;i.dataset.key=it.key;
      const send=debounce(()=>save(it.key,Number(i.value),it),300);
      i.oninput=()=>{v.textContent=i.value;send()};c.appendChild(i);
    }else if(it.type==='list'){
      c.appendChild(head);const s=$('select');s.dataset.key=it.key;
      for(const o of it.options){const op=$('option',null,o.l);op.value=o.v;if(o.v===it.value)op.selected=true;s.appendChild(op)}
      s.onchange=()=>save(it.key,s.value,it);c.appendChild(s);
    }else{
      c.appendChild(head);const i=$('input');i.type='text';i.value=it.value;i.dataset.key=it.key;
      if(it.type==='number')i.inputMode='numeric';
      if(it.type==='color'){i.placeholder='#FF6A00'}
      const send=debounce(()=>save(it.key,i.value,it),600);
      i.oninput=send;i.onchange=()=>save(it.key,i.value,it);c.appendChild(i);
    }
    main.appendChild(c);
  }
  if(focus){const e=main.querySelector('[data-key="'+focus+'"]');if(e&&e.type!=='text')e.focus()}
}
async function load(){
  try{state=await api('/api/state');if(page>=state.pages.length)page=0;tabs();render();status()}
  catch(e){document.getElementById('main').replaceChildren($('div',null,null));const f=$('div',null,e.message);f.id='fatal';document.getElementById('main').appendChild(f);document.getElementById('stext').textContent='Keine Verbindung'}
}
load();
setInterval(async()=>{
  if(document.hidden||!state)return;
  try{const s=await api('/api/state');state.status=s.status;state.running=s.running;status()}catch(_){}
},3000);
</script>
</body>
</html>
