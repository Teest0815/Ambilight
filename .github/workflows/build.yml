name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # Releases anlegen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Verlauf und Tags für die Änderungsliste

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Jede Version bekommt eine neue Nummer: 1.3.<Build>, der versionCode steigt mit.
      - name: Version festlegen
        run: |
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # Der Signaturschlüssel liegt als Secret im Repository-Einstellungen, nicht im Code.
      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "HAVE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 fehlt, die APK ist nur mit dem Debug-Schlüssel signiert und wird nicht veröffentlicht."
          fi

      - name: Build signed release APK
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME"

      # Der Dateiname enthält die Nummer, die App liest sie daraus (code<Nummer>).
      - name: APK benennen
        run: cp app/build/outputs/apk/release/app-release.apk "Ambilight-${VERSION_NAME}-code${VERSION_CODE}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ambilight-apk
          path: Ambilight-*.apk
          if-no-files-found: error

      - name: Release veröffentlichen
        if: github.event_name == 'push' && env.HAVE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="Ambilight-${VERSION_NAME}-code${VERSION_CODE}.apk"
          PREV=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            RANGE="$PREV..HEAD"
          else
            RANGE="-10"
          fi
          git log $RANGE --no-merges --pretty=format:'- %s' > notes.md
          if [ ! -s notes.md ]; then echo "- Verbesserungen und Fehlerbehebungen" > notes.md; fi
          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            gh release upload "v${VERSION_NAME}" "$APK" --clobber
          else
            gh release create "v${VERSION_NAME}" "$APK" \
              --title "Ambilight ${VERSION_NAME}" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
